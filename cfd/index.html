<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CFD-berekening</title>

  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    fieldset {
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid #999;
      border-radius: 6px;
    }

    legend {
      padding: 0 8px;
      font-weight: bold;
    }

    .invoerregel {
      display: grid;
      grid-template-columns: 180px 140px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    input {
      padding: 8px;
      font-size: 1rem;
    }

    button {
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    .afmetingen {
      margin-top: 18px;
      padding: 12px;
      background: #f3f3f3;
      border-radius: 6px;
    }

    .afmetingen p {
      margin: 4px 0;
    }

    #resultaatNavigatie {
      display: none;
      margin-top: 16px;
    }

    #status,
    #resultaat {
      white-space: pre-wrap;
      margin-top: 16px;
    }

    #plotAfbeelding {
      display: none;
      max-width: 100%;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <h1>CFD-berekening</h1>

  <fieldset>
    <legend>Gridinstellingen</legend>

    <div class="invoerregel">
      <label for="gridX">Aantal cellen X:</label>

      <input
        type="number"
        id="gridX"
        min="1"
        step="1"
        value="80"
      >

      <span>Lengterichting</span>
    </div>

    <div class="invoerregel">
      <label for="gridY">Aantal cellen Y:</label>

      <input
        type="number"
        id="gridY"
        min="1"
        step="1"
        value="20"
      >

      <span>Breedterichting</span>
    </div>

    <div class="invoerregel">
      <label for="gridZ">Aantal cellen Z:</label>

      <input
        type="number"
        id="gridZ"
        min="1"
        step="1"
        value="20"
      >

      <span>Hoogterichting</span>
    </div>

    <div class="afmetingen">
      <strong>
        Werkelijke afmetingen bij een celgrootte van 0,125 m:
      </strong>

      <p>
        Lengte X:
        <span id="lengteX">10.000</span> m
      </p>

      <p>
        Breedte Y:
        <span id="lengteY">2.500</span> m
      </p>

      <p>
        Hoogte Z:
        <span id="lengteZ">2.500</span> m
      </p>
    </div>
  </fieldset>

  <fieldset>
    <legend>Ventilatie</legend>

    <div class="invoerregel">
      <label for="debiet">Debiet:</label>

      <input
        type="number"
        id="debiet"
        step="any"
        value="200"
      >

      <span>Vul het gewenste debiet in</span>
    </div>
  </fieldset>

  <button
    type="button"
    id="btnBereken"
  >
    Bereken
  </button>

  <div id="resultaatNavigatie">
    <button
      type="button"
      id="btnResultaatvisualisatie"
      onclick="window.location.href='resultaten.html'"
    >
      Resultaatvisualisatie
    </button>
  </div>

  <div id="status"></div>
  <div id="resultaat"></div>

  <h2>Convergentiecontrole</h2>

  <img
    id="plotAfbeelding"
    alt="Convergentieplot"
  >

  <script src="app.js"></script>
</body>
</html>
