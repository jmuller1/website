<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CFD-resultaatvisualisatie</title>

  <style>
    body {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    fieldset {
      margin-bottom: 24px;
      padding: 20px;
      border: 1px solid #999;
      border-radius: 6px;
    }

    legend {
      padding: 0 8px;
      font-weight: bold;
    }

    .invoerregel {
      display: grid;
      grid-template-columns: 180px 220px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    select,
    input {
      padding: 8px;
      font-size: 1rem;
    }

    button {
      padding: 10px 16px;
      font-size: 1rem;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    #status,
    #informatie {
      white-space: pre-wrap;
      margin-top: 16px;
    }

    #plotAfbeelding {
      display: none;
      max-width: 100%;
      margin-top: 20px;
      border: 1px solid #cccccc;
      border-radius: 6px;
    }

    #sliceContainer {
      display: none;
    }

    #vectorScaleContainer {
      display: none;
    }

    .sliderRij {
      display: grid;
      grid-template-columns: 180px 1fr 80px;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    input[type="range"] {
      width: 100%;
    }

    .helpTekst {
      color: #555555;
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      body {
        margin: 20px auto;
        padding: 0 12px;
      }

      fieldset {
        padding: 14px;
      }

      .invoerregel,
      .sliderRij {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      select,
      input,
      button {
        width: 100%;
        box-sizing: border-box;
      }

      button {
        margin-right: 0;
      }
    }
  </style>
</head>

<body>
  <h1>CFD-resultaatvisualisatie</h1>

  <button
    type="button"
    onclick="window.location.href='index.html'"
  >
    Terug naar invoer
  </button>

  <fieldset>
    <legend>Plotinstellingen</legend>

    <div class="invoerregel">
      <label for="plotType">Grafiek:</label>

      <select id="plotType"></select>

      <span>
        Kies welke resultaatgrafiek je wilt tonen.
      </span>
    </div>

    <div
      id="sliceContainer"
      class="invoerregel"
    >
      <label for="sliceIndex">Doorsnede:</label>

      <select id="sliceIndex"></select>

      <span id="sliceHelp">
        Kies de doorsnede.
      </span>
    </div>

    <div id="vectorScaleContainer">
      <div class="sliderRij">
        <label for="vectorScale">
          Pijlschaal 3D:
        </label>

        <input
          type="range"
          id="vectorScale"
          min="0.2"
          max="5.0"
          step="0.1"
          value="1.0"
        >

        <span id="vectorScaleValue">
          1.0×
        </span>
      </div>

      <p class="helpTekst">
        Hiermee pas je alleen de lengte van de pijlen in de 3D-plot aan.
        De CFD-berekening zelf verandert niet.
      </p>
    </div>

    <button
      type="button"
      id="btnGenereerPlot"
    >
      Genereer plot
    </button>
  </fieldset>

  <div id="status"></div>
  <div id="informatie"></div>

  <img
    id="plotAfbeelding"
    alt="Resultaatplot"
  >

  <script src="resultaten.js"></script>
</body>
</html>
