<!DOCTYPE html>

<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>J Muller | Website in ontwikkeling</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --navy: #001b4d;
      --navy-dark: #001230;
      --blue: #004fc4;
      --cyan: #0098b8;
      --green: #20a85a;
      --text: #102b46;
      --muted: #60778d;
      --white: #ffffff;
      --line: rgba(0, 27, 77, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(0, 79, 196, 0.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(32, 168, 90, 0.15),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #ffffff 0%,
          #f5fafd 50%,
          #edf7f3 100%
        );
    }

    .construction-card {
      width: 100%;
      max-width: 900px;
      padding: 58px 42px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 34px;
      box-shadow: 0 28px 80px rgba(0, 27, 77, 0.13);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      padding: 10px 16px;
      color: var(--navy-dark);
      background: rgba(0, 152, 184, 0.10);
      border: 1px solid rgba(0, 152, 184, 0.22);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(32, 168, 90, 0.13);
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 580px;
      height: auto;
      margin: 0 auto 34px;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--navy-dark);
      font-size: clamp(2.1rem, 5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
    }

    p {
      max-width: 620px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.3vw, 1.2rem);
      line-height: 1.7;
    }

    .divider {
      width: 90px;
      height: 4px;
      margin: 34px auto;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--cyan),
          var(--green)
        );
      border-radius: 999px;
    }

    .button {
      display: inline-block;
      padding: 16px 24px;
      color: var(--white);
      background:
        linear-gradient(
          135deg,
          var(--navy-dark),
          var(--blue)
        );
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 14px 30px rgba(0, 27, 77, 0.20);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 38px rgba(0, 27, 77, 0.26);
    }

    footer {
      margin-top: 46px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 650px) {
      body {
        padding: 14px;
      }

      .construction-card {
        padding: 40px 20px;
        border-radius: 25px;
      }

      .logo {
        max-width: 420px;
      }

      .button {
        width: 100%;
      }
    }
  </style>

</head>

<body>
  <main class="construction-card">
    <div class="status">
      <span class="status-dot"></span>
      Under construction
    </div>


<img
  class="logo"
  src="logo.png"
  alt="Logo van J Muller"
>

<h1>Website in ontwikkeling</h1>

<p>
  Deze website is momenteel nog niet beschikbaar.
  Binnenkort volgt meer informatie.
</p>

<div class="divider"></div>

<a class="button" href="mailto:info@jmuller.be">
  Contact opnemen
</a>

<footer>
  © 2026 J Muller
</footer>


  </main>
</body>
</html>
